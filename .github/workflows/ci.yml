name: Verify V1
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:admin
      - run: npx expo export --platform android --output-dir dist
        working-directory: apps/mobile
      - run: printf 'BOOTSTRAP_SECRET="local-test-secret-only-not-for-production"\n' > apps/api/.dev.vars
      - run: npx wrangler d1 migrations apply fayz-market --local --persist-to /tmp/fayz-ci-db
        working-directory: apps/api
      - name: Integration checks
        run: |
          cd apps/api
          npx wrangler dev --local --port 8787 --persist-to /tmp/fayz-ci-db &
          worker_pid=$!
          trap 'kill $worker_pid' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/health && break || sleep 1; done
          cd ../..
          node scripts/integration.mjs
