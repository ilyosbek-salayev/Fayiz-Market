name: Build Windows admin
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: windows-latest
    env:
      VITE_API_URL: ${{ vars.FAYZ_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require API URL
        run: node -e "if (!process.env.VITE_API_URL) process.exit(1)"
      - run: npm run build:admin
      - run: npm run pack:windows -w @fayz/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: fayz-market-admin-windows
          path: apps/desktop/release/*.exe
