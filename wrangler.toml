# Cloudflare Workers Builds (Git integration) entry point — PRODUCTION.
#
# The dashboard build for Worker "fayz-market-api" runs `npx wrangler deploy` from the repository root
# (root directory "/", no build command). Without a config here Wrangler 4 falls back to framework
# auto-detection and stops with "application detection logic has been run in the root of a workspace".
#
# Both the top level and [env.production] below mirror `[env.production]` of apps/api/wrangler.toml exactly;
# apps/api/deploy-config.test.ts fails if any of the three ever drift. So every one of these updates the SAME
# Worker "fayz-market-api":
#   repository root:  npx wrangler deploy                    (what the Git build runs)
#   repository root:  npx wrangler deploy --env production   (2026-11-25: without [env.production] this
#                     created a separate Worker "fayz-market-api-production" — never let that come back)
#   apps/api:         npx wrangler deploy --env production   (documented manual deploy)
# Local development and QA scripts keep using apps/api/wrangler.toml. Do not run remote D1/R2 commands from
# the repository root by accident: everything below points at production resources.
# Secrets (BOOTSTRAP_SECRET) are never stored here.
name = "fayz-market-api"
main = "apps/api/src/index.ts"
compatibility_date = "2025-06-01"
account_id = "8c9b943ebbbb7bcff4386e624c4482ca"
workers_dev = true
preview_urls = false

[vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://fayz-market-api.ilyosbeksalayev240.workers.dev"
PUBLIC_BASE_URL = "https://fayz-market-api.ilyosbeksalayev240.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "fayz-market"
database_id = "89f6ea76-65dd-43ea-a574-6dc17aed1ddd"
migrations_dir = "apps/api/migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "fayz-market-images"

# Same Worker, same resources. The explicit name stops Wrangler from appending "-production".
[env.production]
name = "fayz-market-api"
account_id = "8c9b943ebbbb7bcff4386e624c4482ca"
workers_dev = true
preview_urls = false

[env.production.vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://fayz-market-api.ilyosbeksalayev240.workers.dev"
PUBLIC_BASE_URL = "https://fayz-market-api.ilyosbeksalayev240.workers.dev"

[[env.production.d1_databases]]
binding = "DB"
database_name = "fayz-market"
database_id = "89f6ea76-65dd-43ea-a574-6dc17aed1ddd"
migrations_dir = "apps/api/migrations"

[[env.production.r2_buckets]]
binding = "IMAGES"
bucket_name = "fayz-market-images"
