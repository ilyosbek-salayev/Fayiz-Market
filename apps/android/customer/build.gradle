plugins { id 'com.android.application' }
android {
    namespace 'uz.fayzmarket.customer'
    compileSdk 35
    defaultConfig { applicationId 'uz.fayzmarket.customer'; minSdk 23; targetSdk 28; versionCode 2; versionName '1.0.1'; resValue 'string', 'default_api_url', (project.findProperty('fayzApiUrl') ?: 'https://fayz-market-api.ilyosbeksalayev240.workers.dev').toString() }
    buildTypes { release { minifyEnabled false } }
    sourceSets { main { assets.srcDirs = ['src/main/assets'] } }
}
