plugins { id 'com.android.application' }
android {
    namespace 'uz.fayzmarket.admin'
    compileSdk 35
    defaultConfig { applicationId 'uz.fayzmarket.admin'; minSdk 23; targetSdk 28; versionCode 7; versionName new groovy.json.JsonSlurper().parse(rootProject.file('../../package.json')).version; resValue 'string', 'default_api_url', (project.findProperty('fayzApiUrl') ?: 'https://fayz-market-api.ilyosbeksalayev240.workers.dev').toString() }
    buildTypes { release { minifyEnabled false } }
    sourceSets { main { assets.srcDirs = ['src/main/assets']; java.srcDirs += ['../shared/java']; res.srcDirs += ['../shared/res'] } }
}
